<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dausa Transport • Admin</title>
<style>
:root{font-family:system-ui,Arial;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#39265f;color:white;padding:18px}.top h1{margin:0;font-size:22px}.wrap{max-width:1000px;margin:18px auto;padding:0 14px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #10294a12}input,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd5e2;border-radius:9px;font:inherit}button{background:#6341a5;color:white;border:0;font-weight:700;cursor:pointer}button.alt{background:#e8eef6;color:#17324f}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #e7edf4;padding:12px 0}.hidden{display:none}.muted{color:#64748b}.danger{color:#b42318}.ok{color:#087443}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f5f1fc;padding:14px;border-radius:10px}.stat b{display:block;font-size:23px}@media(max-width:600px){.row,.stats{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>दौसा ट्रांसपोर्ट</h1><div>एडमिन कंट्रोल पैनल</div></header><main class="wrap">
<section class="card" id="auth"><h2>एडमिन लॉगिन</h2><p class="muted">एडमिन अकाउंट सर्वर शुरू करते समय सेट किए गए ADMIN_EMAIL और ADMIN_PASSWORD से बनता है।</p><input id="email" type="email" placeholder="एडमिन ईमेल"><input id="password" type="password" placeholder="एडमिन पासवर्ड"><button onclick="login()">लॉगिन</button><p id="authMsg" class="muted"></p></section>
<section class="card hidden" id="app"><div style="display:flex;justify-content:space-between;align-items:center"><h2>डैशबोर्ड</h2><button class="alt" style="width:auto" onclick="logout()">लॉगआउट</button></div><div class="stats"><div class="stat">कुल बुकिंग<b id="total">0</b></div><div class="stat">पूरी हुई बुकिंग<b id="done">0</b></div><div class="stat">10% कमीशन<b id="commission">₹0</b></div></div><h2>ड्राइवर मंजूरी</h2><div id="drivers"></div><h2>सभी बुकिंग</h2><div id="orders"></div></section>
</main><script>
const API='/api';let token=localStorage.getItem('dt_admin_token')||'';
async function req(path,opts={}){let r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});let d=await r.json().catch(()=>({error:'सर्वर से जवाब नहीं मिला'}));if(!r.ok)throw Error(d.error||'अनुरोध असफल');return d}
function msg(id,s){let e=document.getElementById(id);e.textContent=s;e.className='danger'}
async function login(){try{let d=await req('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});if(d.user.role!=='admin')throw Error('यह एडमिन अकाउंट नहीं है');token=d.token;localStorage.setItem('dt_admin_token',token);show()}catch(e){msg('authMsg',e.message)}}
function logout(){token='';localStorage.removeItem('dt_admin_token');app.classList.add('hidden');auth.classList.remove('hidden')}
async function show(){auth.classList.add('hidden');app.classList.remove('hidden');await load()}
async function load(){try{let d=await req('/admin/dashboard');total.textContent=d.stats.total;done.textContent=d.stats.completed;commission.textContent='₹'+d.stats.commission.toFixed(2);
drivers.innerHTML=d.drivers.map(x=>`<div class="item"><b>${esc(x.name)}</b> • ${esc(x.email)} • ${x.approved?'मंजूर':'लंबित'} ${!x.approved?`<button onclick="approve('${x.id}')">ड्राइवर मंजूर करें</button>`:''}</div>`).join('')||'<p class="muted">कोई ड्राइवर नहीं।</p>';
orders.innerHTML=d.orders.map(o=>`<div class="item"><b>${esc(o.pickup)} → ${esc(o.drop)}</b><br><small>${esc(o.vehicle)} • ग्राहक ${esc(o.customerName)} • ड्राइवर ${esc(o.driverName||'अभी तय नहीं')} • स्थिति ${esc(o.status)} • किराया ₹${o.fare??'तय नहीं'} • कमीशन ₹${Number(o.commission||0).toFixed(2)}</small></div>`).join('')||'<p class="muted">कोई बुकिंग नहीं।</p>'}catch(e){msg('authMsg',e.message)}}
async function approve(id){try{await req('/admin/drivers/'+id+'/approve',{method:'POST'});await load()}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(token)show().catch(logout);
</script></body></html>
